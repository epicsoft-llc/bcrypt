image: docker:latest

services:
  - docker:dind

stages:
  - build
  - latest
  - dockerhub
  - quayio

before_script:  
  
  
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - export VERSION=$CI_COMMIT_REF_NAME
  - echo "running with version '$VERSION'"

Build:
  stage: build
  script:
    - docker info
    - docker build --pull -t $CI_REGISTRY_IMAGE:$VERSION .
    - docker push $CI_REGISTRY_IMAGE:$VERSION

Latest:
  stage: latest
  script:    
    - docker pull $CI_REGISTRY_IMAGE:$VERSION
    - docker tag $CI_REGISTRY_IMAGE:$VERSION $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

DockerHub:
  stage: dockerhub
  script:
    - export DOCKER_HUB_IMAGE="epicsoft/bcrypt"
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASS
    - docker pull $CI_REGISTRY_IMAGE:$VERSION 
    - docker tag $CI_REGISTRY_IMAGE:$VERSION $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:latest
  only:
    - master

QuayIO:
  stage: quayio
  script:
    - export QUAY_IO_IMAGE="quay.io/epicsoft/bcrypt"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
    - docker pull $CI_REGISTRY_IMAGE:$VERSION 
    - docker tag $CI_REGISTRY_IMAGE:$VERSION $QUAY_IO_IMAGE:latest
    - docker push $QUAY_IO_IMAGE:latest
  only:
    - master
