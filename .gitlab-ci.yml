stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script:
  - docker logout
  - docker logout $CI_REGISTRY

Build:
  stage: build
  script:
    - docker info
    - docker build --pull --no-cache -t $CI_REGISTRY_IMAGE:latest . --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

DockerHub:
  stage: release
  variables:
    DOCKER_HUB_IMAGE: epicsoft/bcrypt
  script:
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:latest
  only:
    - master
